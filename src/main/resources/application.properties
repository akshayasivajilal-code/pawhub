# PAWHUB Database Configuration (MySQL default with automatic DB creation)
spring.datasource.url=jdbc:mysql://localhost:3306/pawhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# Optional OpenAI Integration (safe fallback if key not set)
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4.1-mini